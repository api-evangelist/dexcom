naftiko: 1.0.0-alpha2
info:
  label: Dexcom Developer API — Calibrations
  description: 'Dexcom Developer API — Calibrations. 1 operations. Lead operation: Get Calibration Entries. Self-contained
    Naftiko capability covering one Dexcom business surface.'
  tags:
  - Dexcom
  - Calibrations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEXCOM_API_KEY: DEXCOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: dexcom-calibrations
    baseUri: https://api.dexcom.com
    description: Dexcom Developer API — Calibrations business capability. Self-contained, no shared references.
    resources:
    - name: v3-users-self-calibrations
      path: /v3/users/self/calibrations
      operations:
      - name: getcalibrationsv3
        method: GET
        description: Get Calibration Entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.DEXCOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: dexcom-calibrations-rest
    port: 8080
    description: REST adapter for Dexcom Developer API — Calibrations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v3/users/self/calibrations
      name: v3-users-self-calibrations
      description: REST surface for v3-users-self-calibrations.
      operations:
      - method: GET
        name: getcalibrationsv3
        description: Get Calibration Entries
        call: dexcom-calibrations.getcalibrationsv3
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dexcom-calibrations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dexcom Developer API — Calibrations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-calibration-entries
      description: Get Calibration Entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dexcom-calibrations.getcalibrationsv3
      outputParameters:
      - type: object
        mapping: $.
