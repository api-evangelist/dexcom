naftiko: 1.0.0-alpha2
info:
  label: Dexcom Developer API — Estimated Glucose Values
  description: 'Dexcom Developer API — Estimated Glucose Values. 1 operations. Lead operation: Get Estimated Glucose Values.
    Self-contained Naftiko capability covering one Dexcom business surface.'
  tags:
  - Dexcom
  - Estimated Glucose Values
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEXCOM_API_KEY: DEXCOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: dexcom-estimated-glucose-values
    baseUri: https://api.dexcom.com
    description: Dexcom Developer API — Estimated Glucose Values business capability. Self-contained, no shared references.
    resources:
    - name: v3-users-self-egvs
      path: /v3/users/self/egvs
      operations:
      - name: getegvsv3
        method: GET
        description: Get Estimated Glucose Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.DEXCOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: dexcom-estimated-glucose-values-rest
    port: 8080
    description: REST adapter for Dexcom Developer API — Estimated Glucose Values. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v3/users/self/egvs
      name: v3-users-self-egvs
      description: REST surface for v3-users-self-egvs.
      operations:
      - method: GET
        name: getegvsv3
        description: Get Estimated Glucose Values
        call: dexcom-estimated-glucose-values.getegvsv3
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dexcom-estimated-glucose-values-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dexcom Developer API — Estimated Glucose Values. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-estimated-glucose-values
      description: Get Estimated Glucose Values
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dexcom-estimated-glucose-values.getegvsv3
      outputParameters:
      - type: object
        mapping: $.
