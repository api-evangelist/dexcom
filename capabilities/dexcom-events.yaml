naftiko: 1.0.0-alpha2
info:
  label: Dexcom Developer API — Events
  description: 'Dexcom Developer API — Events. 1 operations. Lead operation: Get User-Entered Events. Self-contained Naftiko
    capability covering one Dexcom business surface.'
  tags:
  - Dexcom
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEXCOM_API_KEY: DEXCOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: dexcom-events
    baseUri: https://api.dexcom.com
    description: Dexcom Developer API — Events business capability. Self-contained, no shared references.
    resources:
    - name: v3-users-self-events
      path: /v3/users/self/events
      operations:
      - name: geteventsv3
        method: GET
        description: Get User-Entered Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.DEXCOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: dexcom-events-rest
    port: 8080
    description: REST adapter for Dexcom Developer API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v3/users/self/events
      name: v3-users-self-events
      description: REST surface for v3-users-self-events.
      operations:
      - method: GET
        name: geteventsv3
        description: Get User-Entered Events
        call: dexcom-events.geteventsv3
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dexcom-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dexcom Developer API — Events. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-user-entered-events
      description: Get User-Entered Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dexcom-events.geteventsv3
      outputParameters:
      - type: object
        mapping: $.
