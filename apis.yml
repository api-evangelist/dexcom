    description: >-
      REST API for retrieving Dexcom continuous glucose monitoring data on
      behalf of authorized end users. Authentication is OAuth 2.0
      authorization code flow; sandbox and production hosts are separate.
      Resources include estimated glucose values (EGVs), events,
      calibrations, devices, data range, and statistics. Intended for
      research, clinical, and consumer applications that integrate Dexcom
      CGM data with other digital health experiences.
