description: >-
  Dexcom is a leading medical device company that develops, manufactures, and distributes continuous glucose monitoring
  (CGM) systems for people with diabetes. The company's wearable sensors stream real-time glucose data to mobile apps,
  dedicated receivers, and connected health platforms. Dexcom exposes a public developer program that lets approved
  third parties retrieve CGM data (estimated glucose values, events, calibrations, alerts, devices, and data range)
  through an OAuth 2.0 secured REST API, with a sandbox for development and a production environment for live patient
  data.
